[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-model-runtime"
version = "0.1.0a1"
description = "Bounded serial model calls with durable identity, explicit approval and budget accounting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[tool.setuptools.packages.find]
where = ["src"]
